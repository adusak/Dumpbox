name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use semantic versioning (for example, v1.2.3)." >&2
            exit 1
          fi

      - name: Test
        run: |
          go test -race ./...
          go vet ./...

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            archive="dumpbox_${VERSION#v}_linux_${arch}.tar.gz"
            build_dir="$(mktemp -d)"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "$build_dir/dumpbox" \
              ./cmd/dumpbox
            tar -C "$build_dir" -czf "dist/$archive" dumpbox
            rm -rf "$build_dir"
          done
          (
            cd dist
            sha256sum ./*.tar.gz > checksums.txt
          )

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/checksums.txt \
            --generate-notes \
            --title "Dumpbox $GITHUB_REF_NAME" \
            --verify-tag
