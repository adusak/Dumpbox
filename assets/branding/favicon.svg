<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Dumpbox favicon</title>
  <desc id="desc">A stamp badge with a smiling poop rising out of an open cardboard box.</desc>
  <defs>
    <linearGradient id="board" x1="14" y1="36" x2="50" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6A65C"/>
      <stop offset="1" stop-color="#C67F32"/>
    </linearGradient>
    <linearGradient id="poo" x1="22" y1="12" x2="44" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7A5236"/>
      <stop offset="1" stop-color="#553522"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="13" fill="#F4EFE1" stroke="#1F3A2E" stroke-width="3.5"/>

  <!-- box front -->
  <path d="M14 37h36v14a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3z" fill="url(#board)" stroke="#1F3A2E" stroke-width="2.6" stroke-linejoin="round"/>
  <rect x="28" y="37" width="6" height="17" fill="#F4EFE1" opacity=".85" stroke="#1F3A2E" stroke-width="0.9"/>

  <!-- poop -->
  <path d="M24 36c-6 0-8-6-2-9-4-4-1-9 4-8-3-5 2-9 6-6 3-3 9-1 8 4 6 0 8 6 3 9 5 3 2 10-4 10Z" fill="url(#poo)" stroke="#1F3A2E" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="27" cy="23" r="1.9" fill="#F4EFE1"/>
  <circle cx="37" cy="23" r="1.9" fill="#F4EFE1"/>
  <circle cx="27.4" cy="23.4" r="0.9" fill="#1F3A2E"/>
  <circle cx="37.4" cy="23.4" r="0.9" fill="#1F3A2E"/>
  <path d="M27 28c3 3 7 3 10 0" fill="none" stroke="#F4EFE1" stroke-width="2.2" stroke-linecap="round"/>

  <!-- open flaps -->
  <path d="M14 37 6 30l14-4 6 9z" fill="#F3C079" stroke="#1F3A2E" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M50 37l8-7-14-4-6 9z" fill="#F3C079" stroke="#1F3A2E" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
