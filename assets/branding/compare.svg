<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Dumpbox logo options</title>
  <desc id="desc">A comparison of playful, delivery stamp, and minimal Dumpbox logo concepts.</desc>
  <rect width="1200" height="650" fill="#F6F7FB"/>
  <text x="60" y="70" fill="#18181B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="800">Dumpbox brand concepts</text>
  <text x="60" y="106" fill="#71717A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Three directions, each with a matching favicon</text>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(60 145)">
      <rect width="1080" height="135" rx="24" fill="#FFF"/>
      <image href="option-1-logo.svg" x="24" y="8" width="510" height="120"/>
      <image href="option-1-favicon.svg" x="930" y="35" width="64" height="64"/>
      <text x="560" y="57" fill="#18181B" font-size="22" font-weight="750">01 · Playful pop</text>
      <text x="560" y="88" fill="#71717A" font-size="16">Friendly, colorful, emoji-forward</text>
    </g>
    <g transform="translate(60 305)">
      <rect width="1080" height="135" rx="24" fill="#FFF"/>
      <image href="option-2-logo.svg" x="24" y="8" width="510" height="120"/>
      <image href="option-2-favicon.svg" x="930" y="35" width="64" height="64"/>
      <text x="560" y="57" fill="#18181B" font-size="22" font-weight="750">02 · Delivery stamp</text>
      <text x="560" y="88" fill="#71717A" font-size="16">Bold, sturdy, self-hosted character</text>
    </g>
    <g transform="translate(60 465)">
      <rect width="1080" height="135" rx="24" fill="#FFF"/>
      <image href="option-3-logo.svg" x="24" y="8" width="510" height="120"/>
      <image href="option-3-favicon.svg" x="930" y="35" width="64" height="64"/>
      <text x="560" y="57" fill="#18181B" font-size="22" font-weight="750">03 · Minimal drop</text>
      <text x="560" y="88" fill="#71717A" font-size="16">Clean, modern, app-friendly</text>
    </g>
  </g>
</svg>
