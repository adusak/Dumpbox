services:
  dumpbox:
    image: ghcr.io/adusak/dumpbox:${DUMPBOX_VERSION:-latest}
    build: .
    pull_policy: always
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      MAX_BYTES_PER_USER: ${MAX_BYTES_PER_USER:-21474836480}
      MAX_FILES_PER_USER: ${MAX_FILES_PER_USER:-10000}
    volumes:
      - dumpbox-data:/data

volumes:
  dumpbox-data:
