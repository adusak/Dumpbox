services:
  dumpbox:
    image: ghcr.io/adusak/dumpbox:${DUMPBOX_VERSION:-latest}
    build: .
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    volumes:
      - dumpbox-data:/data

volumes:
  dumpbox-data:
